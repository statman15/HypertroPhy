<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HypertroPhy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<script>
  // Android's installed app ignores theme-color's media attribute, so set one tag from the phone's mode (same as Bookshelf).
  (() => {
    const dark = matchMedia('(prefers-color-scheme: dark)');
    const tag = document.querySelector('meta[name="theme-color"]');
    const set = () => { tag.content = dark.matches ? '#0c0c0d' : '#ffffff'; };
    set();
    dark.addEventListener('change', set);
  })();
</script>
<title>HypertroPhy</title>
<style>
  /* Bookshelf's iPhone grammar, with an iron-orange tint. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --sheet: #f2f2f7; --group: #ffffff;
    --label: #111113; --label2: #636366; --sep: rgba(60, 60, 67, .2);
    --fill: rgba(118, 118, 128, .12); --fill-strong: rgba(118, 118, 128, .2);
    --tint: #c2410c; --on-tint: #ffffff; --danger: #d70015;
    --lift: rgba(30, 20, 15, .16); --chart: #c2410c;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d; --sheet: #1c1c1e; --group: #2c2c2e;
      --label: #f5f5f7; --label2: #a1a1a6; --sep: rgba(84, 84, 88, .6);
      --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
      --tint: #ff8a4c; --on-tint: #2a1003; --danger: #ff6961;
      --lift: rgba(0, 0, 0, .5); --chart: #e8641f; /* chart oranges checked with the dataviz validator */
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100dvh; font-size: 17px; line-height: 1.3; color: var(--label); background: var(--bg);
    padding-bottom: calc(150px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; touch-action: manipulation; text-align: left; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .ic { width: 22px; height: 22px; flex: none; fill: currentColor; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .head { position: sticky; top: 0; z-index: 2; padding: calc(16px + env(safe-area-inset-top)) 16px 10px; background: var(--bg); box-shadow: 0 .5px 0 var(--sep); }
  .head h1 { margin: 0; font-size: 34px; font-weight: 700; line-height: 41px; letter-spacing: .01em; }
  .count { margin: 0 0 12px; font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; }
  .search { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 8px; border-radius: 10px; background: var(--fill); color: var(--label2); }
  .search .ic { width: 18px; height: 18px; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--label); font-size: 17px; -webkit-appearance: none; }
  .search input::placeholder { color: var(--label2); }
  .search:focus-within { box-shadow: 0 0 0 2px color-mix(in srgb, var(--tint) 55%, transparent); }

  /* Filters are native selects dressed as capsules: the phone's own picker does the work. */
  .filters { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .chip { position: relative; flex: none; display: flex; align-items: center; height: 34px; border-radius: 999px; background: var(--fill); font-size: 15px; font-weight: 500; }
  .chip select { height: 100%; padding: 0 30px 0 14px; border: 0; border-radius: inherit; background: none; -webkit-appearance: none; appearance: none; }
  .chip::after { content: ''; position: absolute; right: 13px; top: 13px; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
  .chip.on { color: var(--on-tint); background: var(--tint); }
  .chip.on select { font-weight: 600; }
  .chip option { color: initial; }

  .list { list-style: none; margin: 0; padding: 0 16px; }
  .row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; padding: 8px 0; box-shadow: inset 0 -.5px 0 var(--sep); }
  .row:active { opacity: .6; }
  .list li { content-visibility: auto; contain-intrinsic-size: auto 73px; }
  .thumb { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 .5px var(--sep); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row .t { display: -webkit-box; overflow: hidden; font-weight: 600; line-height: 1.2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .a { display: block; margin-top: 2px; overflow: hidden; font-size: 15px; color: var(--label2); white-space: nowrap; text-overflow: ellipsis; }

  .empty { display: grid; justify-items: center; gap: 6px; padding: 56px 32px; text-align: center; }
  .empty h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .empty p { max-width: 30ch; margin: 0 0 12px; color: var(--label2); }
  .pill { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 600; color: var(--on-tint); background: var(--tint); }
  .pill:active { transform: scale(.97); opacity: .9; }

  .sheet { position: fixed; inset: auto 0 0 0; width: 100%; max-width: 600px; max-height: calc(100dvh - env(safe-area-inset-top) - 10px); margin: 0 auto;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom)); border: 0; border-radius: 22px 22px 0 0; color: var(--label); background: var(--sheet);
    overflow: auto; overscroll-behavior: contain; }
  .sheet::backdrop { background: rgba(0, 0, 0, .35); }
  .sheet[open] { animation: rise .28s cubic-bezier(.2, .9, .25, 1); }
  @keyframes rise { from { transform: translateY(100%); } }
  .close { position: sticky; top: 14px; z-index: 2; float: right; display: grid; place-items: center; width: 32px; height: 32px; margin: 14px -2px 0 0; border-radius: 50%; color: var(--label2); background: var(--sheet); box-shadow: inset 0 0 0 32px var(--fill); }
  .close .ic { width: 15px; height: 15px; }
  .sheet h2 { margin: 16px 0 12px; font-size: 22px; font-weight: 700; line-height: 1.2; }
  .sheet h3 { margin: 20px 0 8px; font-size: 17px; font-weight: 600; }

  /* The demo: start and end photos stacked, the end photo blinking in every second to read as the movement. */
  .demo { position: relative; margin: 58px -16px 0; aspect-ratio: 3 / 2; background: #fff; }
  .demo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .demo img + img { animation: flip 2s steps(1) infinite; }
  @keyframes flip { 0% { opacity: 0; } 50% { opacity: 1; } }

  .group { margin: 0; border-radius: 12px; background: var(--group); overflow: hidden; }
  .facts { padding: 4px 16px; }
  .facts div { display: flex; gap: 16px; justify-content: space-between; padding: 10px 0; font-size: 15px; }
  .facts div + div { box-shadow: inset 0 .5px 0 var(--sep); }
  .facts dt { flex: none; color: var(--label2); }
  .facts dd { margin: 0; text-align: right; }
  .steps { margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45; }
  .steps li + li { margin-top: 8px; }

  .glass { background: color-mix(in srgb, var(--group) 72%, transparent); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
  @media (prefers-reduced-transparency: reduce) { .glass { background: var(--group); -webkit-backdrop-filter: none; backdrop-filter: none; } }

  /* Tab bar: Bookshelf's floating capsule. --dock-gap is its calibration knob above the home indicator. */
  :root { --dock-gap: 12px; }
  .dock { position: fixed; z-index: 3; left: 12px; right: 12px; bottom: max(10px, calc(env(safe-area-inset-bottom) - var(--dock-gap))); max-width: 560px; margin: 0 auto; }
  .tabs { display: flex; height: 64px; padding: 4px; border-radius: 999px; box-shadow: 0 10px 30px var(--lift), inset 0 0 0 .5px var(--sep); }
  .tabs button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: 999px; font-size: 11px; font-weight: 600; text-align: center; color: var(--label2); transition: background-color .2s, color .2s; }
  .tabs button .ic { width: 25px; height: 25px; }
  .tabs button[aria-selected=true] { color: var(--tint); background: var(--fill); }

  /* Update banner: pinned under the status bar until tapped or skipped. */
  .updatebar { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top) + 8px); left: 12px; right: 12px; max-width: 560px; margin: 0 auto;
    display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 999px; font-weight: 600; box-shadow: 0 10px 30px var(--lift), inset 0 0 0 .5px var(--sep); }
  .updatebar span { flex: 1; }
  body:has(#update:not([hidden])) .head { padding-top: calc(76px + env(safe-area-inset-top)); }
  .updatebar .pill { min-height: 36px; padding: 0 16px; text-decoration: none; }
  .updatebar .iconbtn { margin: 0; width: 36px; height: 36px; }
  .updatebar .ic { width: 16px; height: 16px; }

  /* Rest timer floats just above the tab bar. */
  .restbar { position: fixed; z-index: 3; left: 12px; right: 12px; bottom: calc(max(10px, calc(env(safe-area-inset-bottom) - var(--dock-gap))) + 72px); max-width: 560px; margin: 0 auto;
    display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 6px; border-radius: 999px; box-shadow: 0 10px 30px var(--lift), inset 0 0 0 .5px var(--sep); }
  .restbar span { flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
  .restbar b { font-size: 20px; color: var(--tint); }
  .restbar button { min-width: 52px; height: 40px; padding: 0 12px; border-radius: 999px; font-weight: 600; text-align: center; background: var(--fill); }
  .restbar .skip { color: var(--tint); }

  .pad { padding: 12px 16px; }
  .muted { color: var(--label2); font-size: 15px; }
  .wide { width: 100%; }
  .text-btn { min-height: 44px; padding: 0 4px; font-weight: 600; color: var(--tint); }
  .text-btn:disabled { color: var(--label2); }
  .row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row-head .count { margin: 0; }
  .pickbar { display: flex; align-items: center; justify-content: space-between; margin: -8px 0 4px; color: var(--tint); }
  .sec { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 8px; }
  .sec h2 { margin: 0; font-size: 22px; }
  .card { margin-bottom: 12px; padding: 12px 16px 16px; }
  .card-top { display: flex; align-items: center; justify-content: space-between; }
  .card .a { margin: 0 0 12px; color: var(--label2); font-size: 15px; }
  .label { margin: 16px 0 8px; font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--label2); }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill); }
  .seg button { flex: 1; min-height: 34px; border-radius: 8px; font-size: 15px; font-weight: 500; text-align: center; }
  .seg button[aria-checked=true] { font-weight: 600; background: var(--group); box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
  .remove { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin-top: 12px; border-radius: 12px; color: var(--danger); background: var(--fill); }

  /* One exercise in the logger or routine editor. Supersets share a tinted rail on the left. */
  .ex { margin-bottom: 12px; padding: 4px 0 8px; }
  .ex.ss { padding-left: 12px; box-shadow: inset 3px 0 0 var(--tint); }
  .ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ex-name { font-size: 17px; font-weight: 700; color: var(--tint); }
  .iconbtn { display: grid; place-items: center; width: 44px; height: 44px; margin-right: -10px; border-radius: 50%; color: var(--label2); }
  .ex-sub { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--label2); }
  .mini select { height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: var(--fill); color: var(--tint); font-size: 14px; font-weight: 600; -webkit-appearance: none; appearance: none; }
  .sets { width: 100%; margin-top: 6px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .sets th { padding: 4px 2px; font-size: 12px; font-weight: 600; color: var(--label2); text-align: center; }
  .sets td { padding: 3px 2px; text-align: center; }
  .sets td:first-child { width: 36px; font-weight: 600; }
  .sets .prev { font-size: 14px; color: var(--label2); white-space: nowrap; }
  .sets input { width: 100%; max-width: 76px; height: 36px; border: 0; border-radius: 8px; background: var(--fill); text-align: center; font-size: 17px; font-weight: 600; -webkit-appearance: none; }
  .sets input::placeholder { color: var(--label2); font-weight: 400; }
  .sets td:last-child { width: 48px; }
  .check { display: grid; place-items: center; width: 40px; height: 36px; margin: auto; border-radius: 8px; color: var(--label2); background: var(--fill); }
  .check .ic { width: 18px; height: 18px; }
  .sets tr.done td { background: color-mix(in srgb, var(--tint) 14%, transparent); }
  .sets tr.done .check { color: var(--on-tint); background: var(--tint); }
  .link { display: flex; align-items: center; gap: 6px; margin: -4px 0 12px; min-height: 36px; font-size: 14px; font-weight: 600; color: var(--label2); }
  .link .ic { width: 18px; height: 18px; }
  .link.on { color: var(--tint); }
  .fields { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; margin-top: 6px; }
  .fields label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--label2); }
  .fields input, .fields select { width: 100%; height: 36px; border: 0; border-radius: 8px; background: var(--fill); text-align: center; font-size: 17px; -webkit-appearance: none; appearance: none; }
  .fields select { padding: 0 10px; font-size: 15px; }
  .range { display: flex; align-items: center; gap: 4px; color: var(--label); }
  .title-input { width: 100%; height: 48px; margin-bottom: 12px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--fill); font-size: 22px; font-weight: 700; }

  .hrow { display: grid; gap: 2px; width: 100%; padding: 12px 0; box-shadow: inset 0 -.5px 0 var(--sep); }
  .hrow .t { font-weight: 600; }
  .hrow .a { overflow: hidden; font-size: 15px; color: var(--label2); white-space: nowrap; text-overflow: ellipsis; }
  .pr { display: inline-flex; align-items: center; gap: 3px; color: var(--tint); font-weight: 600; }
  .pr .ic { width: 15px; height: 15px; }
  .setlist { margin: 0; padding: 4px 16px; list-style: none; counter-reset: s; font-variant-numeric: tabular-nums; }
  .setlist li { display: flex; justify-content: space-between; padding: 8px 0; counter-increment: s; }
  .setlist li::before { content: counter(s); width: 28px; font-weight: 600; color: var(--label2); }
  .setlist li span:first-of-type { flex: 1; }
  .setlist li + li { box-shadow: inset 0 .5px 0 var(--sep); }
  .target { font-weight: 600; color: var(--label); }
  .target.up { color: var(--tint); }
  .target.deload { color: var(--danger); }

  .chart { margin: 16px 0 0; padding: 12px 8px 4px; }
  .chart figcaption { display: grid; gap: 2px; padding: 0 8px 6px; font-size: 13px; color: var(--label2); }
  .chart figcaption span { font-size: 17px; color: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .chart .grid { stroke: var(--sep); stroke-width: 1; }
  .chart .tick { font-size: 11px; fill: var(--label2); font-variant-numeric: tabular-nums; }
  .chart .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--chart); stroke: var(--group); stroke-width: 2; }
  .chart .dot.on { r: 6; }
  .chart .hit { fill: transparent; }
  .pill .ic { width: 20px; height: 20px; }
  .pill.quiet { margin-top: 10px; color: var(--tint); background: var(--fill); }
  .card-top small, .setlist small { font-size: 12px; }

  /* Forms: plan builder and AI settings. */
  .form { display: grid; gap: 14px; }
  .form label, .form legend { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--label2); }
  .form select, .form input:not([type=checkbox]) { height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--group); font-size: 17px; color: var(--label); }
  .form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form fieldset { margin: 0; padding: 0; border: 0; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label { display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--group); font-size: 15px; font-weight: 500; color: var(--label); cursor: pointer; }
  .checks label:has(:checked) { color: var(--on-tint); background: var(--tint); }
  .checks input { position: absolute; opacity: 0; width: 0; }
  .checks label:has(:focus-visible) { outline: 2px solid var(--tint); outline-offset: 2px; }
  .form-rows { margin: 12px 0; }
  .form-rows label { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; font-size: 15px; color: var(--label2); }
  .form-rows label + label { box-shadow: inset 0 .5px 0 var(--sep); }
  .form-rows input { min-width: 0; height: 44px; border: 0; background: none; font-size: 17px; color: var(--label); }

  /* Coach chat. The composer floats above the tab bar, and above the rest timer when that is showing. */
  .chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
  .suggest { display: grid; gap: 8px; margin: 4px 0 8px; }
  .suggest button { padding: 12px 14px; border-radius: 12px; background: var(--fill); font-size: 15px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; color: var(--on-tint); background: var(--tint); border-bottom-right-radius: 6px; }
  .msg.assistant { align-self: flex-start; background: var(--fill); border-bottom-left-radius: 6px; }
  .msg.error { align-self: stretch; max-width: none; color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .via { align-self: flex-start; margin-top: -6px; padding-left: 6px; font-size: 12px; color: var(--label2); }
  .typing { display: flex; gap: 4px; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--label2); animation: breathe .9s ease-in-out infinite alternate; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes breathe { to { opacity: .25; } }
  .composer { position: fixed; z-index: 3; left: 12px; right: 12px; bottom: calc(max(10px, calc(env(safe-area-inset-bottom) - var(--dock-gap))) + 72px); max-width: 560px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 6px; padding: 6px 6px 6px 16px; border-radius: 24px; box-shadow: 0 10px 30px var(--lift), inset 0 0 0 .5px var(--sep); }
  body:has(#rest:not([hidden])) .composer { bottom: calc(max(10px, calc(env(safe-area-inset-bottom) - var(--dock-gap))) + 132px); }
  .composer textarea { flex: 1; min-height: 36px; max-height: 120px; padding: 7px 0; border: 0; outline: 0; resize: none; background: none; font: inherit; color: var(--label); field-sizing: content; }
  .send { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: var(--on-tint); background: var(--tint); }
  .send:disabled { opacity: .4; }
  .send .ic { width: 18px; height: 18px; }
  .menu-list { margin-top: 8px; }
  .menu-list.gap { margin-top: 24px; }
  .menu-list button { display: block; width: 100%; min-height: 50px; padding: 0 16px; font-weight: 500; }
  .menu-list button + button, .menu-list label { box-shadow: inset 0 .5px 0 var(--sep); }
  .menu-list label { display: flex; align-items: center; min-height: 50px; padding: 0 16px; font-weight: 500; cursor: pointer; }
  .menu-list label:active { background: var(--fill); }
  .menu-list label input { position: absolute; width: 0; opacity: 0; }
  .menu-list label:has(:focus-visible) { outline: 2px solid var(--tint); outline-offset: -2px; }
  .nag { margin-bottom: 12px; padding-top: 14px; }
  .nag .pill { margin-top: 0; }
  .menu-list button:active { background: var(--fill); }
  .menu-list .danger { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    /* No blinking: show the two positions side by side. */
    .demo { display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 3 / 1; }
    .demo img { position: static; }
  }
</style>
</head>

<main>
  <section data-tab="workout" id="workout"></section>
  <section data-tab="history" id="history" hidden></section>
  <section data-tab="exercises" hidden>
    <div class="head">
      <div id="pickBar" class="pickbar" hidden><b>Choose an exercise</b><button id="pickCancel" class="text-btn">Cancel</button></div>
      <h1>Exercises</h1>
      <p id="count" class="count"></p>
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span class="visually-hidden">Search exercises</span>
        <input type="search" id="q" placeholder="Search" autocomplete="off"></label>
      <div class="filters">
        <label class="chip"><span class="visually-hidden">Muscle</span><select id="muscle"><option value="">All Muscles</option></select></label>
        <label class="chip"><span class="visually-hidden">Equipment</span><select id="equip"><option value="">All Equipment</option></select></label>
      </div>
    </div>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden>
      <h2>No Matches</h2>
      <p>Try a different name, or clear the filters.</p>
      <button id="clear" class="pill">Clear Filters</button>
    </div>
  </section>
  <section data-tab="coach" id="coach" hidden></section>
  <section data-tab="settings" id="settings" hidden></section>
</main>

<div id="update" class="updatebar glass" role="status" hidden>
  <span id="updateText"></span>
  <a id="updateGo" class="pill">Update</a>
  <button id="updateSkip" class="iconbtn" aria-label="Skip this version"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
</div>

<div id="rest" class="restbar glass" role="timer" aria-live="off" hidden>
  <button data-adj="-15" aria-label="15 seconds less">−15</button>
  <span>Rest <b id="restLeft"></b></span>
  <button data-adj="15" aria-label="15 seconds more">+15</button>
  <button class="skip">Skip</button>
</div>

<nav class="dock">
  <div id="tabs" class="tabs glass" role="tablist" aria-label="Sections">
    <button role="tab" data-go="workout" aria-selected="true"><svg class="ic" aria-hidden="true"><use href="#i-barbell"/></svg>Workout</button>
    <button role="tab" data-go="history" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg>History</button>
    <button role="tab" data-go="exercises" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg>Exercises</button>
    <button role="tab" data-go="coach" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg>Coach</button>
    <button role="tab" data-go="settings" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg>Settings</button>
  </div>
</nav>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <button class="close" data-done aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  <div id="sheetBody"></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
